# Docker-specific DBHub configuration for the local Tribble database.
#
# OrbStack containers reach host-published services through
# host.docker.internal. The password is injected by Docker Compose from the
# existing 1Password-backed shell environment.

[[sources]]
id = "tribble-local"
description = "Tribble local"
type = "postgres"
host = "host.docker.internal"
port = 5432
database = "postgres"
user = "tribbledev"
password = "${TRIBBLE_LOCAL_DB_PASSWORD}"
sslmode = "disable"
lazy = true
connection_timeout = 10
query_timeout = 30

[[sources]]
id = "tribble-local-write"
description = "Tribble local (write)"
type = "postgres"
host = "host.docker.internal"
port = 5432
database = "postgres"
user = "tribbledev"
password = "${TRIBBLE_LOCAL_DB_PASSWORD}"
sslmode = "disable"
lazy = true
connection_timeout = 10
query_timeout = 30

[[tools]]
name = "execute_sql"
source = "tribble-local"
readonly = true
max_rows = 5000

[[tools]]
name = "search_objects"
source = "tribble-local"

[[tools]]
name = "execute_sql"
source = "tribble-local-write"
readonly = false
max_rows = 5000
