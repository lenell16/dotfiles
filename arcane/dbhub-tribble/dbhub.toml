# DBHub Tribble — Arcane / Umbrel deployment.
# MCP (tailnet): https://dbhub-tribble.<tailnet>.ts.net/mcp
# Workbench:      https://dbhub-tribble.<tailnet>.ts.net/
#
# Env vars: TRIBBLE_* and PRESENTON_* (Arcane project Environment).
# SSH keys: /secrets/*.pem (mount from secrets/ — not in git).
#
# Local-only sources (tribble-local, presenton-local) omitted — no localhost DBs on Umbrel.

[[sources]]
id = "tribble-prod"
description = "Tribble prod"
type = "postgres"
host = "tribble.postgres.database.azure.com"
port = 5432
database = "postgres"
user = "tribble"
password = "${TRIBBLE_PROD_DB_PASSWORD}"
sslmode = "require"
lazy = true
connection_timeout = 60
query_timeout = 30
ssh_host = "20.231.68.152"
ssh_user = "tribbleprod"
ssh_key = "/secrets/vm-prod-pg-tunnel_key.pem"

