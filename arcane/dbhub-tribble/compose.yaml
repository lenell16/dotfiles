services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-dbhub-tribble
    hostname: dbhub-tribble
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    restart: unless-stopped

  dbhub:
    image: bytebase/dbhub:latest
    container_name: dbhub-tribble
    network_mode: service:tailscale
    command:
      - --transport
      - http
      - --host
      - 127.0.0.1
      - --port
      - "8085"
      - --config
      - /config/dbhub.toml
    environment:
      TRIBBLE_PROD_DB_PASSWORD: ${TRIBBLE_PROD_DB_PASSWORD}
      TRIBBLE_STAGING_DB_PASSWORD: ${TRIBBLE_STAGING_DB_PASSWORD}
      TRIBBLE_TEST_DB_PASSWORD: ${TRIBBLE_TEST_DB_PASSWORD}
      PRESENTON_PROD_DATABASE_URL: ${PRESENTON_PROD_DATABASE_URL}
      PRESENTON_STAGING_DATABASE_URL: ${PRESENTON_STAGING_DATABASE_URL}
      PRESENTON_TEST_DATABASE_URL: ${PRESENTON_TEST_DATABASE_URL}
    volumes:
      - ./dbhub.toml:/config/dbhub.toml:ro
      - ./secrets:/secrets:ro
    depends_on:
      - tailscale
    restart: unless-stopped

volumes:
  tailscale-state:
